name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build .NET Framework 4.8 executable
        shell: pwsh
        run: |
          dotnet build PclDownloadEnable.csproj --configuration Release
          New-Item -ItemType Directory -Path publish -Force | Out-Null
          Copy-Item bin/Release/net48/PCL-Download-Enable.exe publish/PCL-Download-Enable.exe

      - name: Prepare release metadata
        id: metadata
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "manual-${{ github.run_id }}"
            $title = "Pre-release $tag"
          } else {
            $tag = "${{ github.ref_name }}"
            $title = $tag
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT

      - name: Create stable GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.metadata.outputs.tag }}" `
            publish/PCL-Download-Enable.exe `
            --title "${{ steps.metadata.outputs.title }}" `
            --generate-notes

      - name: Create pre-release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.metadata.outputs.tag }}" `
            publish/PCL-Download-Enable.exe `
            --title "${{ steps.metadata.outputs.title }}" `
            --target "${{ github.sha }}" `
            --prerelease `
            --generate-notes
